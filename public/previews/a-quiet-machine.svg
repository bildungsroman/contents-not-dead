<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="A Quiet Machine preview">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1b1030"/>
      <stop offset="60%" stop-color="#120a24"/>
      <stop offset="100%" stop-color="#05030c"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcff54"/>
      <stop offset="50%" stop-color="#ec3fa0"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <g transform="translate(400 250)" fill="none" stroke="url(#neon)" filter="url(#soft)" opacity="0.8">
    <circle r="45" stroke-width="4"/>
    <circle r="95" stroke-width="3"/>
    <circle r="150" stroke-width="2.4"/>
    <circle r="210" stroke-width="2"/>
  </g>
  <text x="400" y="262" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="20" letter-spacing="6" opacity="0.85" filter="url(#soft)">A QUIET MACHINE</text>
  <text x="400" y="470" text-anchor="middle" fill="#fcff54" font-family="monospace" font-size="14" letter-spacing="4" opacity="0.9">PREVIEW · SUBSCRIBE OR PAY TO VIEW</text>
</svg>
