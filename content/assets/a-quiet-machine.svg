<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="A Quiet Machine generative concentric type-forms">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#1b1030"/>
      <stop offset="60%" stop-color="#120a24"/>
      <stop offset="100%" stop-color="#05030c"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcff54"/>
      <stop offset="50%" stop-color="#ec3fa0"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <g transform="translate(600 375)" fill="none" stroke="url(#neon)" filter="url(#glow)">
    <circle r="60" stroke-width="2" opacity="0.9"/>
    <circle r="120" stroke-width="1.6" opacity="0.8"/>
    <circle r="185" stroke-width="1.3" opacity="0.7"/>
    <circle r="255" stroke-width="1.1" opacity="0.6"/>
    <circle r="330" stroke-width="0.9" opacity="0.5"/>
  </g>
  <g transform="translate(600 375)" fill="#fcff54" opacity="0.92" font-family="monospace" font-size="20" letter-spacing="6">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
      <text x="-150" y="-300">CONTENT · CONTENT · CONTENT · CONTENT</text>
    </g>
  </g>
  <g transform="translate(600 375)" fill="#ec3fa0" opacity="0.85" font-family="monospace" font-size="16" letter-spacing="10">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="140s" repeatCount="indefinite"/>
      <text x="-210" y="230">IS · NOT · DEAD · IS · NOT · DEAD · IS · NOT · DEAD</text>
    </g>
  </g>
  <text x="600" y="392" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="26" letter-spacing="8" opacity="0.95">A QUIET MACHINE</text>
</svg>
